; ===========================================================================
; SAMU-VR Configuration (A Story About My Uncle - OpenXR 6DOF VR Mod)
; ===========================================================================

[VR]
; Conversion scale from OpenXR meters (right-handed Y-up) to UE3 Unreal Units (left-handed Z-up).
; Default: 1.0 meter = 72.0 UU.
WorldScale=72.0
IpdScale=1.0
NearClipUU=2.0
FarClipUU=100000.0
DecoupleCamera=1
; Recenter head position/yaw/height automatically when each gameplay level starts (F7 recenters manually)
AutoRecenterOnLevel=1
; Extra camera height in centimeters on top of the recentered head height (negative = lower)
EyeHeightOffsetCm=0

[Comfort]
; Blocks scripted camera pitch/roll animations and shakes during grapple swings, charges, and landings.
CameraLockSuppressor=1
SuppressPitchRoll=1
; Virtual-Key codes: 117 = F6 (toggle Camera-Lock Suppressor), 118 = F7 (recenter HMD), 121 = F10 (VR Settings Menu)
ToggleSuppressorVKey=117
RecenterVKey=118
OpenVrMenuVKey=121

[Stereo]
; Enables the DX9-to-DX11 shared texture pipeline and OpenXR xrEndFrame layer submission.
EnableStereo=1
SideBySideCompanionWindow=0
; 0 = Mono (full-rate smooth both eyes), 1 = AFR alternate-frame stereo (real depth; each eye updates every other frame)
StereoMode=0
; 120 = F9 toggles Mono <-> AFR live
ToggleStereoVKey=120
; Submit each frame with the exact head pose it was rendered with so the compositor can reproject it (1 = on)
MatchRenderPose=1

[Performance]
; Raises UE3's smoothed frame-rate cap (game default 62) above the HMD rate; 0 = leave the game's setting
TargetFrameRate=120
; Disable desktop vsync so the monitor refresh rate can't cap the game below the headset rate
DisableVSync=1
; 1 = switch off UE3 motion blur, DOF, ambient occlusion, radial blur & 1-frame thread lag for crisp low-latency VR
DisableMotionBlur=1
; Game render resolution height, applied via 'setres' at the headset's per-eye aspect (square on most HMDs).
; -1 = auto (eye height, max 90% of desktop height), 0 = keep the game's own resolution, >0 = explicit height
RenderHeight=-1

[Display]
; Mode: 0 = Auto (flat virtual screen in menus/loading, immersive in gameplay), 1 = Always flat, 2 = Always immersive
Mode=0
FlatScreenDistanceM=2.5
FlatScreenWidthM=3.2
; Horizontal FOV forced on the game camera during gameplay (0 = auto: covers the full headset view)
GameFovDeg=0
; Trim for how large the game image is displayed (1.0 = exact 1:1 head-turn angular match; applied symmetrically to game & VR FOV)
ViewScale=1.0
; D3D11 contrast-adaptive image sharpening (0.0 = off .. 1.0 = crispest; default 0.55)
ImageSharpness=0.55
; Lifts dialogue subtitles and Flash tutorial popups up into comfortable VR view (0.0 .. 1.0)
HudTextLift=0.82
; 119 = F8 toggles forced flat-screen mode
ToggleFlatScreenVKey=119

[MotionControls]
; 6DOF Right Aim Pose grapple glove override & OpenXR action set PlayerInput injection.
Enable6DofGrapple=1
EnableControllerInput=1
TriggerThreshold=0.55
GripThreshold=0.55
ThumbstickDeadzone=0.15
GrappleRangeUU=4500.0
; 1 = the game's aim (grapple, interactions) follows the right controller instead of where you look
AimFromHand=1
; 1 = hide the game's own crosshair (it is glued to the centre of your view); the hand reticle replaces it
HideGameCrosshair=1
; 1 = draw the hand in true perspective at the controller (0 = the game's flat-screen enlarged "weapon FOV")
TrueScaleHand=1
; 1 = spawn tracked left-hand visual mesh (0 = hidden / disabled)
EnableLeftHand=0
; VR hand reticle size multiplier (0.5 .. 2.0)
ReticleScale=1.0
; Left stick moves relative to: 0 = body, 1 = head direction, 2 = left controller direction
LocomotionDirection=1
; Right-stick smooth-turn speed multiplier (0 disables stick turning)
TurnSpeedScale=1.0
